<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#14171b;color:#eee;font:16px system-ui}header,main{max-width:1500px;margin:auto;padding:20px}header{position:sticky;top:0;background:#14171bf5;z-index:1;border-bottom:1px solid #333}h1{margin:0 0 8px;font-size:24px}a{color:#a7ceff}nav{overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:#22272e;color:inherit;text-decoration:none;border:1px solid #363d47;cursor:pointer;padding:0;font:inherit;text-align:left}.card:hover{border-color:#8ec5ff}.card img{width:100%;height:190px;object-fit:contain;background:#101215}.label{padding:12px;overflow-wrap:anywhere}.folder{display:grid;place-items:center;height:130px;font-size:24px;color:#a7ceff}dialog{border:0;padding:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;background:#101215;color:#eee}dialog::backdrop{background:#000}.viewer{height:100%;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:12px;padding:12px;flex-wrap:wrap}.bar span{flex:1;overflow-wrap:anywhere}.bar button{font:inherit;padding:8px 16px;cursor:pointer}#large{min-height:0;flex:1;width:100%;object-fit:contain}#status{padding:8px;text-align:center;color:#ccc}button:focus-visible,a:focus-visible{outline:3px solid #a7ceff}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card img{height:135px}header,main{padding:12px}}
</style></head><body>
<header><h1>{{.Title}}</h1><nav><a href="/">Start</a> / {{.Current}}{{if .HasParent}} · <a href="{{.Parent}}">Eine Ebene höher</a>{{end}}</nav></header>
<main><div class="grid">{{range .Items}}{{if .Album}}<a class="card" href="{{.Link}}"><div class="folder">Ordner</div><div class="label">{{.Name}} /</div></a>{{else}}<button class="card photo" data-preview="{{.Preview}}" data-original="{{.Original}}" data-name="{{.Name}}"><img src="{{.Thumb}}" loading="lazy" decoding="async" alt="{{.Name}}"><div class="label">{{.Name}}</div></button>{{end}}{{else}}<p>Dieser Ordner enthält keine sichtbaren Alben oder unterstützten Bilder.</p>{{end}}</div></main>
<dialog id="lightbox" aria-label="Bildvorschau"><div class="viewer"><div class="bar"><button id="prev" aria-label="Vorheriges Bild">←</button><button id="next" aria-label="Nächstes Bild">→</button><span id="name"></span><a id="original" target="_blank" rel="noopener">Original öffnen</a><button id="close">Schließen</button></div><img id="large" alt=""><div id="status" aria-live="polite"></div></div></dialog>
<script>
const photos=[...document.querySelectorAll('.photo')],box=document.querySelector('#lightbox'),large=document.querySelector('#large'),status=document.querySelector('#status');let current=0;
function show(i){current=(i+photos.length)%photos.length;const p=photos[current];document.querySelector('#name').textContent=(current+1)+' / '+photos.length+' — '+p.dataset.name;document.querySelector('#original').href=p.dataset.original;large.alt=p.dataset.name;status.textContent='Vorschau wird geladen …';large.src=p.dataset.preview;if(!box.open)box.showModal()}
photos.forEach((p,i)=>p.addEventListener('click',()=>show(i)));large.onload=()=>status.textContent='';large.onerror=()=>status.textContent='Vorschau konnte nicht erzeugt werden. Das Original ist weiterhin verlinkt.';
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#close').onclick=()=>box.close();document.addEventListener('keydown',e=>{if(!box.open)return;if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});
</script></body></html>
