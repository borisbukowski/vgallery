{{define "content"}}
<h1>Albums</h1>
{{if .Albums}}{{template "albumgrid" .Albums}}{{else}}<p class="muted">No albums yet.</p>{{end}}
{{if .Recent}}<h2>Recently added</h2>{{template "photogrid" .Recent}}{{end}}
{{if .Admin}}
<section class="admin">
  <h2>Manage</h2>
  <form action="/admin/album" method="post">
    <input type="hidden" name="parent_id" value="0">
    <input name="name" placeholder="New album name" required>
    <button>Create album</button>
  </form>
</section>
{{end}}
{{end}}
