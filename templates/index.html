<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>{{.Title}}</title>
	<style>
		body {
			font-family: sans-serif;
			background: #111;
			color: #eee;
			margin: 0;
			padding: 16px;
		}
		h1 {
			margin: 0 0 16px;
		}
		.months {
			display: flex;
			flex-direction: column;
			gap: 12px;
			max-width: 900px;
		}
		.month-link {
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 12px 14px;
			background: #1b1b1b;
			border: 1px solid #333;
			border-radius: 8px;
			color: #8cf;
			text-decoration: none;
		}
		.month-link:hover {
			background: #222;
		}
		.preview {
			flex: 0 0 auto;
		}
		.preview img {
			display: block;
			width: 140px;
			height: 100px;
			object-fit: cover;
			border-radius: 6px;
			background: #222;
		}
		.info {
			display: flex;
			flex: 1 1 auto;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
			min-width: 0;
		}
		.label {
			font-size: 1rem;
			color: #8cf;
		}
		.count {
			color: #aaa;
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<h1>{{.Title}}</h1>

	<div class="months">
	{{range .Months}}
		<a class="month-link" href="/month/{{.Key}}">
			<div class="preview">
				<img src="/imgs/{{(index .Images 0).Name}}" alt="{{.Label}}" loading="lazy">
			</div>
			<div class="info">
				<span class="label">{{.Label}}</span>
				<span class="count">{{len .Images}} image{{if ne (len .Images) 1}}s{{end}}</span>
			</div>
		</a>
	{{else}}
		<p>No images found.</p>
	{{end}}
	</div>
</body>
</html>
