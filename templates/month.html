<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>{{.Title}} - {{.Month.Label}}</title>
	<style>
		body {
			font-family: sans-serif;
			background: #111;
			color: #eee;
			margin: 0;
			padding: 16px;
		}
		a {
			color: #8cf;
			text-decoration: none;
		}
		h1 {
			margin: 0 0 8px;
		}
		.topbar {
			margin-bottom: 12px;
		}
		.meta {
			color: #aaa;
			margin-bottom: 16px;
		}
		.nav {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			margin-bottom: 18px;
		}
		.nav a, .nav span {
			background: #1b1b1b;
			border: 1px solid #333;
			border-radius: 8px;
			padding: 8px 12px;
		}
		.nav .disabled {
			color: #666;
		}
		.grid {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}
		.grid img {
			height: {{.ThumbHeight}}px;
			width: auto;
			display: block;
			border-radius: 4px;
			background: #222;
		}
	</style>
</head>
<body>
	<div class="topbar">
		<a href="/">[all months]</a>
	</div>

	<h1>{{.Month.Label}}</h1>
	<div class="meta">{{len .Month.Images}} image{{if ne (len .Month.Images) 1}}s{{end}}</div>

	<div class="nav">
		{{if .Prev}}
			<a href="/month/{{.Prev.Key}}">[older] {{.Prev.Label}}</a>
		{{else}}
			<span class="disabled">[older]</span>
		{{end}}

		{{if .Next}}
			<a href="/month/{{.Next.Key}}">{{.Next.Label}} [newer]</a>
		{{else}}
			<span class="disabled">[newer]</span>
		{{end}}
	</div>

	<div class="grid">
	{{range .Month.Images}}
		<div>
			<a href="/imgs/{{.Name}}">
				<img src="/imgs/{{.Name}}" alt="{{.Name}}" loading="lazy">
			</a>
		</div>
	{{end}}
	</div>
</body>
</html>
